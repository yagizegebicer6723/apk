<style>

<body>
<canvas id="c" width="320" height="500" tabindex="0" aria-label="Oyun alanı"></canvas>
<p>Zıplamak için dokun, tıkla ya da boşluk tuşuna bas.</p>
<script>
(function(){

var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,slide,delay){if(save.mute)return;var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(delay||0);
 o.type=type||'square';o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),s+d);
 g.gain.setValueAtTime(vol||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02);}
function noise(d,vol){if(save.mute)return;var a=ac();if(!a)return;var n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(var i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);var s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol||.2;s.connect(g);g.connect(a.destination);s.start();}
function buzz(p){if(save.mute)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
var SND={

 score:function(){tone(740,.07,'square',.07);tone(988,.1,'square',.07,0,.07);},
 hit:function(){noise(.25,.25);tone(160,.3,'sawtooth',.14,-110);buzz(60);},
 quest:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.14,'triangle',.12,0,i*.09);});buzz([40,40,40,40,80]);},
 buy:function(){tone(660,.08,'square',.08);tone(880,.08,'square',.08,0,.08);tone(1320,.16,'square',.08,0,.16);buzz(30);},
 click:function(){tone(520,.05,'triangle',.08);buzz(10);},
 no:function(){tone(180,.15,'square',.08,-40);buzz([30,30,30]);}
};
var QT={score:'Tek oyunda {n} puan yap',pipes:'Bugün toplam {n} boru geç',games:'Bugün {n} oyun oyna',multi:'{n} oyunda en az {m} puan yap',streak:'Üst üste {n} oyunda en az {m} puan',exact:'Bir oyunu tam {n} puanla bitir'};
function buildPool(){var P=[];
 [5,6,7,8,9,10,12,14,15,16,18,20,22,25,30,35,40,50].forEach(function(n){P.push({k:'score',n:n,g:n,r:Math.max(10,Math.round(n*1.5))});});
 [10,15,20,30,40,50,60,70,80,100,120,150,200,250,300].forEach(function(n){P.push({k:'pipes',n:n,g:n,r:Math.round(n*.4)+6});});
 [2,3,4,5,6,8,10,12,15,20,25].forEach(function(n){P.push({k:'games',n:n,g:n,r:n*3+8});});
 [2,3,4,5].forEach(function(n){[3,5,8,10,15,20].forEach(function(m){P.push({k:'multi',n:n,m:m,g:n,r:Math.round(n*m*.9)+8});});});
 [2,3,4,5].forEach(function(n){[2,3,5,8,10].forEach(function(m){P.push({k:'streak',n:n,m:m,g:n,r:Math.round(n*m*1.3)+10});});});
 for(var e=3;e<=14;e++)P.push({k:'exact',n:e,g:1,r:30+e*3});
 return P;}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

function ensureQuests(){
 if(save.q&&save.q.v===2&&save.q.day===today())return;
 var P=buildPool(),used={},list=[];
 while(list.length<3){var c=P[Math.floor(Math.random()*P.length)];if(used[c.k])continue;used[c.k]=1;list.push({k:c.k,n:c.n,m:c.m||0,g:c.g,r:c.r,p:0,done:false});}
 save.q={v:2,day:today(),list:list};
 persist();}
function prog(q){return Math.min(q.g,q.p);}
function questsAfterGame(){ensureQuests();var Q=save.q,got=[];
 Q.list.forEach(function(q){if(q.done)return;
  if(q.k==='score')q.p=Math.max(q.p,score);
  else if(q.k==='pipes')q.p+=score;
  else if(q.k==='games')q.p++;
  else if(q.k==='multi'){if(score>=q.m)q.p++;}
  else if(q.k==='streak'){if(score>=q.m)q.p++;else q.p=0;}
  else if(q.k==='exact'){if(score===q.n)q.p=1;}
  if(q.p>=q.g){q.done=true;save.coins+=q.r;got.push(q);}});return got;}
ensureQuests();

function mk(px){return{x:px,top:70+Math.random()*(H-GROUND-GAP-140),passed:false}}

function flap(){

 else if(state==='play'){bird.v=JUMP;SND.flap();}
 else if(state==='over'&&flash<=0){reset();state='ready';}
}

function hit(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}
var BTN={x:36,y:232,w:116,h:38},BTNQ={x:168,y:232,w:116,h:38},BACK={x:12,y:12,w:70,h:30},MUTE={x:W-48,y:12,w:36,h:30};
function tap(px,py){
 if(state==='quests'){if(hit(px,py,BACK)){SND.click();state='ready';}return;}
 if(state==='shop'){
  if(hit(px,py,BACK)){SND.click();state='ready';return;}
  if(hit(px,py,PGP)&&PAGE>0){PAGE--;SND.click();return;}
  if(hit(px,py,PGN)&&PAGE<Math.ceil(BIRDS.length/PER)-1){PAGE++;SND.click();return;}
  for(var pos=PAGE*PER;pos<Math.min(BIRDS.length,PAGE*PER+PER);pos++)if(hit(px,py,cardRect(pos-PAGE*PER))){var i=ORDER[pos];
   if(save.owned.indexOf(i)>=0){save.sel=i;persist();SND.click();}
   else if(save.coins>=BIRDS[i].p){save.coins-=BIRDS[i].p;save.owned.push(i);save.sel=i;persist();say('Yeni karakter: '+BIRDS[i].n);SND.buy();}
   else {SND.no();say('Yetmiyor: '+(BIRDS[i].p-save.coins)+' puan daha lazım');}
  }
  return;
 }
 if(state==='ready'&&hit(px,py,MUTE)){save.mute=!save.mute;persist();SND.click();return;}
 if(state==='ready'&&hit(px,py,BTN)){SND.click();state='shop';return;}
 if(state==='ready'&&hit(px,py,BTNQ)){SND.click();state='quests';return;}
 flap();
}
function say(m){msg=m;msgT=120;}
function update(){
 t++;if(flash>0)flash--;if(msgT>0)msgT--;
 if(state==='ready'){bird.y=H/2-GROUND/2+Math.sin(t/12)*8;return;}
 if(state==='shop'||state==='quests')return;
 if(state==='over'){if(bird.y<H-GROUND-bird.r){bird.v+=GRAV;bird.y+=bird.v;}return;}
 bird.v+=GRAV;bird.y+=bird.v;
 speed=2.2+Math.min(score*0.06,1.4);
 pipes.forEach(function(p){p.x-=speed;
  if(!p.passed&&p.x+50<bird.x){p.passed=true;score++;SND.score();}
  if(bird.x+bird.r-3>p.x&&bird.x-bird.r+3<p.x+50&&(bird.y-bird.r+3<p.top||bird.y+bird.r-3>p.top+GAP))over();
 });
 if(pipes[0].x<-60){pipes.shift();pipes.push(mk(pipes[pipes.length-1].x+175));}
 if(bird.y+bird.r>H-GROUND){bird.y=H-GROUND-bird.r;over();}
 if(bird.y-bird.r<0){bird.y=bird.r;bird.v=0;}
}

car:function(B,w){x.fillStyle=B.b;x.fillRect(-17,-3,34,10);

 for(var i=0;i<3;i++){x.fillStyle=(Math.floor(t/8)+i)%2?'#ffd166':'#ef6351';x.beginPath();x.arc(-9+i*9,3,2,0,7);x.fill();}},

};
function drawBird(cx,cy,rot,k,wob){
 var B=BIRDS[k];x.save();x.translate(cx,cy);x.rotate(rot);
 if(B.t&&SK[B.t]){SK[B.t](B,wob);x.restore();return;}
 x.fillStyle=B.b;x.beginPath();x.arc(0,0,13,0,7);x.fill();
 x.fillStyle=B.w;x.beginPath();x.ellipse(-4,3+wob,8,5,-.3,0,7);x.fill();
 x.fillStyle='#fff';x.beginPath();x.arc(6,-4,5,0,7);x.fill();
 x.fillStyle='#2b2236';x.beginPath();x.arc(8,-4,2.3,0,7);x.fill();
 x.fillStyle='#ef6351';x.beginPath();x.moveTo(11,0);x.lineTo(21,3);x.lineTo(11,7);x.fill();
 x.restore();
}

 x.fillStyle=g;x.fillRect(0,0,W,H);
